name: Konectian - Compilar cliente iOS (IPA)

# Compilacion autonoma del cliente Konectian para iOS.
#
# Por que existe este workflow:
#   El lanzador multiplataforma completo (konectian-build.yml -> flutter-build.yml)
#   depende de workflows reutilizables anidados que devuelven "startup_failure"
#   en este repositorio antes de que arranque cualquier job. Este workflow
#   reproduce la MISMA receta probada de RustDesk para iOS (generacion del
#   flutter-rust-bridge + vcpkg arm64-ios + cargo build + flutter build ipa) de
#   forma inline, sin anidar workflows reutilizables.
#
#   El servidor y la clave publica ya estan integrados en
#   libs/hbb_common/src/config.rs (konectian.com), por lo que la app generada se
#   conecta a la infraestructura de Konectian directamente.
#
# Firma de Apple (opcional):
#   Si estan configurados los secretos APPLE_PROVISIONING_PROFILE /
#   MACOS_P12_BASE64 / MACOS_P12_PASSWORD / APPLE_TEAM_ID, se genera un IPA
#   firmado. Si NO estan configurados, el workflow NO falla: genera un archivo
#   .xcarchive/IPA SIN firmar (util para inspeccion o para firmar despues).
#   Consulta la guia GUIA-FIRMA-APPLE.md para activar la firma y publicar en la
#   App Store / TestFlight.
#
# Ejecutar manualmente: Actions -> "Konectian - Compilar cliente iOS (IPA)"
# -> Run workflow. El resultado queda como Artifact descargable y, si hay una
# etiqueta v* publicada, se adjunta tambien al GitHub Release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/konectian-ios.yml"

env:
  # macOS/iOS requieren Rust 1.81 (no 1.75) por el toolchain de Apple.
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  UPLOAD_ARTIFACT: "true"
  # Secretos opcionales de firma expuestos como variables de entorno.
  MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
  MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Generar el artefacto flutter-rust-bridge (bridge por defecto, Flutter 3.22.3)
  #    Identico al generate-bridge de konectian-linux.yml (copiado de bridge.yml).
  # ---------------------------------------------------------------------------
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-3.22.3

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3 por defecto: extended_text 14 necesita un Dart mas nuevo, se baja para resolver.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ---------------------------------------------------------------------------
  # 2) Compilar el cliente iOS (aarch64-apple-ios). Copiado de flutter-build.yml
  #    (build-rustdesk-ios). Sin secretos de firma produce un IPA/.xcarchive
  #    SIN firmar; con secretos, exporta un IPA firmado.
  # ---------------------------------------------------------------------------
  build-ios:
    needs: [generate-bridge]
    name: build konectian ios aarch64
    runs-on: macos-14
    env:
      arch: aarch64
      target: aarch64-apple-ios
      vcpkg_triplet: arm64-ios
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install build runtime
        run: |
          brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ env.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-14-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rust lib
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Build iOS (sin firma)
        run: |
          pushd flutter
          flutter build ipa --release --no-codesign || flutter build ios --release --no-codesign
          popd

      - name: Empaquetar resultado iOS
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set -e
          OUT="konectian-${{ env.VERSION }}-ios.ipa"
          # 1) Preferir un IPA real si Flutter lo genero.
          IPA=$(find flutter/build/ios/ipa -name "*.ipa" 2>/dev/null | head -n1 || true)
          if [ -n "$IPA" ]; then
            cp "$IPA" "$OUT"
          else
            # 2) Sin firma no hay IPA distribuible: empaquetar el .app dentro de un
            #    Payload/ y comprimirlo como .ipa (instalable en dispositivos con firma posterior).
            APP=$(find flutter/build/ios -maxdepth 4 -name "Runner.app" -type d 2>/dev/null | head -n1 || true)
            if [ -z "$APP" ]; then
              APP=$(find flutter/build/ios -maxdepth 5 -name "*.app" -type d 2>/dev/null | head -n1 || true)
            fi
            if [ -n "$APP" ]; then
              rm -rf Payload && mkdir -p Payload
              cp -R "$APP" Payload/
              zip -qr "$OUT" Payload
              rm -rf Payload
            else
              echo "No se encontro ni IPA ni .app; empaquetando el .xcarchive"
              ARCH=$(find flutter/build/ios -maxdepth 4 -name "*.xcarchive" -type d 2>/dev/null | head -n1 || true)
              if [ -n "$ARCH" ]; then
                zip -qr "$OUT" "$ARCH"
              else
                echo "ERROR: no se genero ningun artefacto de iOS" >&2
                exit 1
              fi
            fi
          fi
          ls -lh "$OUT"

      - name: Upload IPA
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: konectian-${{ env.VERSION }}-ios-ipa
          path: konectian-${{ env.VERSION }}-ios.ipa

      # --- Publicar en el GitHub Release si la ejecucion viene de una etiqueta v* ---
      - name: Preparar activo del Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp konectian-${{ env.VERSION }}-ios.ipa konectian-${{ env.VERSION }}-ios-ipa

      - name: Subir al GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            konectian-${{ env.VERSION }}-ios-ipa
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
