name: Konectian - Compilar clientes (todas las plataformas)

# Lanzador manual de la compilacion nativa multiplataforma de Konectian.
# Reutiliza la receta probada de flutter-build.yml (misma que usa RustDesk),
# pero bajo la marca Konectian y con el servidor por defecto ya horneado en
# libs/hbb_common/src/config.rs (konectian.com + clave publica propia).
#
# Se dispara manualmente desde la pestana Actions -> "Konectian - Compilar
# clientes" -> Run workflow. Al terminar, los binarios de cada plataforma
# quedan como Artifacts descargables del run y (si se indica tag) como Release.

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Etiqueta del Release (deja 'manual' para solo artifacts)"
        type: string
        default: "manual"

jobs:
  build-clientes:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
